# Вход в экосистему pre-commit: 15 тысяч звёзд и десятки тысяч проектов, где файл
# .pre-commit-config.yaml уже лежит. Человеку не нужно узнавать про AQK и ставить его отдельно —
# он дописывает три строки в файл, который у него уже есть.
#
# ЗАЧЕМ ИМЕННО ТАК. Комплект отвечает на вопрос, которого у pre-commit нет: тот запускает
# проверки, но не говорит, КАКИЕ проверки в репозитории вообще есть, работают ли они и на чём
# здесь уже обжигались. Мы это разбирали по их исходникам: «no built-in compliance levels,
# scoring systems, or reporting mechanisms» и «does not verify that hooks catch what they claim».
# Это не замена pre-commit, а слой над ним.
#
# language: node — pre-commit ставит пакет сам и даёт команду `aqk`. Зависимостей у пакета нет,
# поэтому установка быстрая и не тянет чужого кода в окружение хука.

- id: aqk
  name: AQK — уровень репозитория и прогон объявленных гейтов
  description: >
    Считает ступень готовности репозитория к работе агентов (AQK-0…3) и запускает то, что
    репозиторий объявил в .aqk.yml. Роняет коммит ниже требуемой ступени или при упавшем гейте.
  entry: aqk doctor --run --min 1 --brief
  language: node
  pass_filenames: false
  always_run: true
  # ВЫВОД ПОКАЗЫВАЕТСЯ И НА УСПЕХЕ. Умолчание pre-commit — печатать только при провале
  # (проверено по их документации 2026-09-08: «forces the output of the hook to be printed even
  # when the hook passes»). То есть комплект, который всё держит, для человека неотличим от
  # невставленного: поставил, поработал неделю, не увидел ни строки. Это ровно тот порок, против
  # которого он написан, — тишина неотличима от успеха. Поэтому `--brief`: одна строка на успехе
  # и весь вывод при провале.
  verbose: true

# Только чтение: ничего не запускает и ничего не пишет. Для того, кто хочет видеть уровень и
# список недостающих сторожей, но пока не готов ронять коммит.
- id: aqk-doctor
  name: AQK — только осмотр, без прогона и без порога
  description: >
    Показывает ступень, применимые записи каталога и то, чего в репозитории нет. Ничего не
    пишет и никуда ничего не отправляет.
  entry: aqk doctor
  language: node
  pass_filenames: false
  always_run: true

# Обязательный минимум проекта: 14 пунктов методички из 50 подтверждаются прогоном.
- id: aqk-baseline
  name: AQK — обязательный минимум проекта прогоном, а не глазами
  description: >
    Чек-лист по пунктам, которые машина может подтвердить по репозиторию: файл-замок любой
    экосистемы, конфиг линтера любого языка, трекер ошибок в зависимостях, конвейер, тесты.
    Называет, чем подтверждён каждый пункт.
  entry: aqk doctor --baseline
  language: node
  pass_filenames: false
  always_run: true
