# Разбор входящих issue и PR нейросетью. Не пишет в GitHub ничего — только решает, стоит ли
# человеку сейчас смотреть, и шлёт вердикт в Telegram. Публичное действие от имени проекта
# (комментарий, ярлык) — отдельный шаг, которого здесь нет: его добавляют осознанно, а не заодно.
#
# ЗАЧЕМ ИМЕННО ТАК. Обратная связь — то немногое, что проверяет утверждения стандарта живой
# практикой (ТЗ.md §9, «чужой пользователь»). Но её читают только когда кто-то откроет вкладку —
# а открывают редко. Разбор нейросетью не решает за человека, чинить или нет: он только называет,
# на что стоит потратить внимание сейчас, а не через неделю.
#
# СЕКРЕТЫ (Settings → Secrets and variables → Actions в этом репозитории):
#   CLAUDE_CODE_OAUTH_TOKEN — токен подписки Claude Code: `claude setup-token` в терминале,
#                             где уже выполнен `claude login`. Не платный API-ключ — свой лимит.
#   TELEGRAM_BOT_TOKEN      — токен бота, выданный @BotFather
#   TELEGRAM_CHAT_ID        — куда слать (свой user id или id чата)
# Без любого из трёх шаг доставки просто промолчит — это не авария конвейера.
#
# ПОЧЕМУ ПРАВА НА ЗАПИСЬ НЕ ВЫДАНЫ. `claude-code-action` — полноценный агент: у него есть свои
# инструменты для комментариев и правок. Мы зовём его только спросить вердикт, а не действовать
# от имени проекта. Отключать это официальным флагом ненадёжно — того стоило бы гадание по
# недокументированному поведению, а не проверка. Вместо этого правим то, что можно проверить
# самим механизмом GitHub: у токена `permissions:` ниже нет прав записи, значит попытка что-то
# опубликовать — если агент вообще её предпримет — провалится на уровне API, а не на честном слове.

name: разбор обратной связи

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: собрать текст обращения
        id: gather
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -eu
          case "$EVENT_NAME" in
            issues)
              TITLE=$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")
              BODY=$(jq -r '.issue.body // ""' "$GITHUB_EVENT_PATH")
              URL=$(jq -r '.issue.html_url' "$GITHUB_EVENT_PATH")
              KIND="issue"
              ;;
            issue_comment)
              TITLE=$(jq -r '.issue.title' "$GITHUB_EVENT_PATH")
              BODY=$(jq -r '.comment.body // ""' "$GITHUB_EVENT_PATH")
              URL=$(jq -r '.comment.html_url' "$GITHUB_EVENT_PATH")
              KIND="комментарий"
              ;;
            pull_request_target)
              TITLE=$(jq -r '.pull_request.title' "$GITHUB_EVENT_PATH")
              BODY=$(jq -r '.pull_request.body // ""' "$GITHUB_EVENT_PATH")
              URL=$(jq -r '.pull_request.html_url' "$GITHUB_EVENT_PATH")
              NUM=$(jq -r '.pull_request.number' "$GITHUB_EVENT_PATH")
              DIFF=$(gh pr diff "$NUM" --repo "$GITHUB_REPOSITORY" 2>/dev/null | head -c 12000 || true)
              BODY="$BODY

          --- diff (обрезан до 12000 символов) ---
          $DIFF"
              KIND="pull request"
              ;;
            *) exit 0 ;;
          esac
          {
            echo "kind=$KIND"
            echo "url=$URL"
            echo "title<<AQKEOF"
            echo "$TITLE"
            echo "AQKEOF"
            echo "body<<AQKEOF"
            echo "$BODY" | head -c 16000
            echo "AQKEOF"
          } >> "$GITHUB_OUTPUT"

      - name: спросить Claude Code по подписке, стоит ли смотреть
        id: ask
        if: steps.gather.outputs.title != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Разбери одно обращение в репозиторий AQK — CLI, который проверяет готовность проекта
            к работе AI-агентов набором гейтов (скриптов-сторожей). Только оцени, ничего не меняй:
            не редактируй файлы, не создавай ветки, не публикуй комментарии.

            Тип: ${{ steps.gather.outputs.kind }}
            Заголовок: ${{ steps.gather.outputs.title }}
            Текст:
            ${{ steps.gather.outputs.body }}

            Реши: это похоже на настоящий баг, воспроизводимую поломку или разумный PR с правкой —
            или это спам, дубликат, вопрос без сути, оффтоп, неясно без диалога.
          # --max-turns здесь не настоящий потолок SDK, а известный баг самого действия:
          # https://github.com/anthropics/claude-code-action/issues/1177 — значение не доходит
          # до SDK (тот молча использует свои 10), но действие сверяет фактическое число ходов
          # именно с этим числом и падает, если Claude использовал больше. Ставим 10 — реальный
          # потолок SDK, а не наугад подобранное число.
          claude_args: |
            --max-turns 10
            --json-schema '{"type":"object","properties":{"verdict":{"type":"string","enum":["да","нет"]},"reason":{"type":"string","description":"одно короткое предложение по-русски"}},"required":["verdict","reason"]}'

      - name: сообщить в Telegram
        if: steps.ask.outcome == 'success' && fromJSON(steps.ask.outputs.structured_output || '{}').verdict == 'да'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KIND: ${{ steps.gather.outputs.kind }}
          TITLE: ${{ steps.gather.outputs.title }}
          URL: ${{ steps.gather.outputs.url }}
          # Условие if: не мешает GitHub вычислить env: для этого шага заранее — падает
          # на пустом structured_output того же класса, что и раньше (журнал, 2026-09-04).
          REASON: ${{ fromJSON(steps.ask.outputs.structured_output || '{}').reason }}
        run: |
          set -eu
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ]; then
            echo "TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID не заданы — вердикт есть, доставки нет"
            exit 0
          fi
          TEXT="Похоже, стоит посмотреть: $KIND
          $TITLE
          $URL

          $REASON"
          curl -sS "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${TEXT}" \
            -o /dev/null
