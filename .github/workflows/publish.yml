# Выпуск AQK в npm. Запускается от метки версии, публикует через доверенного издателя (OIDC):
# npm сам удостоверяет, что запрос пришёл именно из этого репозитория и именно из этого файла.
#
# ЗАЧЕМ ИМЕННО ТАК. Публиковать с машины — значит держать на ней либо долгоживущий токен, либо
# второй фактор. Токен утекает: журнал, 2026-09-04 — токен с правом записи попал в переписку и
# был отозван в тот же час. Второй фактор привязан к одному устройству: сломался ноутбук —
# выпуск встал. Здесь не хранится ни токена, ни ключа: право публиковать выдаётся на один прогон
# и только этому файлу. Это же рекомендация самого npm начиная с v12.
#
# КАК ВЫПУСКАТЬ: поднять version в package.json, записать раздел в CHANGELOG.md, затем
#   git tag v0.2.3 && git push origin v0.2.3
# Метка обязана совпасть с version — иначе прогон остановится до публикации.

name: выпуск

on:
  push:
    tags: [ 'v*' ]

# id-token нужен для OIDC: без него npm не сможет удостоверить происхождение запроса.
# Больше ничего не даём — выпуску незачем уметь писать в репозиторий.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # Двух коммитов истории требует гейт commit-explains-itself: в мелком клоне не виден
      # родитель, состав коммита не определить, и гейт пропускает себя. Та же причина, что в ci.yml.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Доверенный издатель поддержан начиная с npm 11.5.1; на образе лежит более старая.
      - name: npm посвежее
        run: npm install -g npm@latest

      # Метка и version — главный источник путаницы при выпуске: опубликовать 0.2.2 под меткой
      # v0.2.3 можно ровно один раз, дальше версия занята навсегда. Сверяем до публикации.
      - name: метка совпадает с версией
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "метка v$TAG, а в package.json $PKG — выпуск остановлен"
            exit 1
          fi
          echo "версия $PKG"

      # Те же два шага, что в ci.yml: без этих инструментов записи каталога остаются
      # непроверенными, а «не проверено» не должно становиться нормой на выпуске.
      - name: инструменты для записей каталога
        run: pipx install vulture==2.16

      - name: заранее скачать инструменты записей
        run: npx --yes knip@6 --version

      # Выпускается только то, что прошло собственный стандарт. Иначе комплект про качество
      # уезжал бы к людям непроверенным — ровно то, против чего он написан.
      - name: все объявленные проверки и порог уровня
        run: node tool/program.mjs doctor --run --min 1

      # --provenance прикладывает удостоверение происхождения: на странице npm видно, из какого
      # коммита и какого прогона собран пакет. Проверить сборку можно не веря на слово.
      - name: публикация
        run: npm publish --provenance --access public
