# Выпуск AQK в npm. Запускается от метки версии, публикует через доверенного издателя (OIDC):
# npm сам удостоверяет, что запрос пришёл именно из этого репозитория и именно из этого файла.
#
# ЗАЧЕМ ИМЕННО ТАК. Публиковать с машины — значит держать на ней либо долгоживущий токен, либо
# второй фактор. Токен утекает: журнал, 2026-09-04 — токен с правом записи попал в переписку и
# был отозван в тот же час. Второй фактор привязан к одному устройству: сломался ноутбук —
# выпуск встал. Здесь не хранится ни токена, ни ключа: право публиковать выдаётся на один прогон
# и только этому файлу. Это же рекомендация самого npm начиная с v12.
#
# КАК ВЫПУСКАТЬ: поднять version в package.json, записать раздел в CHANGELOG.md, затем
#   git tag v0.2.3 && git push origin v0.2.3
# Метка обязана совпасть с version — иначе прогон остановится до публикации.

name: выпуск

on:
  push:
    tags: [ 'v*' ]

# id-token нужен для OIDC: без него npm не сможет удостоверить происхождение запроса.
# Больше ничего не даём — выпуску незачем уметь писать в репозиторий.
# Права всего потока — только чтение. `id-token: write` выдаётся ОДНОМУ заданию ниже: на
# уровне потока он достался бы и заданию релиза, которому OIDC не нужен вовсе.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token нужен только здесь: им npm удостоверяет происхождение запроса.
    permissions:
      contents: read
      id-token: write
    steps:
      # Двух коммитов истории требует гейт commit-explains-itself: в мелком клоне не виден
      # родитель, состав коммита не определить, и гейт пропускает себя. Та же причина, что в ci.yml.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 2

      # Кеш npm здесь не включается: поле `cache:` не задано, а `registry-url` кеша не заводит.
      # Находка снята точечно и с причиной, а не порогом на весь файл.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # zizmor: ignore[cache-poisoning] кеш не включён
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # Доверенный издатель поддержан начиная с npm 11.5.1; на образе лежит 10.x. Версия
      # закреплена на 11: `npm@latest` — это уже 12.x, она требует Node 22+ и роняет выпуск,
      # а заодно меняет умолчания установки (скрипты и удалённые зависимости выключены), из-за
      # чего `npx knip` внутри прогона может повести себя иначе, чем при проверке. Выпуск — не
      # то место, где выясняют совместимость с новой мажорной версией пакетного менеджера.
      - name: npm посвежее
        run: npm install -g npm@11

      # Метка и version — главный источник путаницы при выпуске: опубликовать 0.2.2 под меткой
      # v0.2.3 можно ровно один раз, дальше версия занята навсегда. Сверяем до публикации.
      - name: метка совпадает с версией
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "метка v$TAG, а в package.json $PKG — выпуск остановлен"
            exit 1
          fi
          echo "версия $PKG"

      # НЕ то же самое, что в ci.yml, и это намеренно. Там ставятся инструменты для приёмки
      # ВСЕГО каталога (ruff, checkwash) — здесь каталог не принимают. Здесь гоняют гейты из
      # .aqk.yml, и нужны только их арбитры. Строка «те же два шага, что в ci.yml» стояла тут
      # раньше и уже была неправдой: ci.yml ушёл вперёд, а выпуск об этом молчал.
      - name: инструменты для записей каталога
        run: |
          pipx install vulture==2.16
          # slopcheck нужен гейту no-phantom-package, объявленному в .aqk.yml. Без него шаг
          # ниже падает с кодом 2 «не найден slopcheck», и выпуск встаёт на ровном месте.
          # Проверено прогоном 2026-09-08 до метки: `doctor --run --min 1` без slopcheck даёт
          # код 1. Этот файл однажды уже разошёлся с ci.yml — там инструментов ставится больше;
          # сюда попадает только то, что нужно ГЕЙТАМ ИЗ МАНИФЕСТА, их и гоняет шаг ниже.
          npm i -g slopcheck@0.2.0
          pipx install zizmor==1.30.0

      - name: заранее скачать инструменты записей
        run: npx --yes knip@6 --version

      # Выпускается только то, что прошло собственный стандарт. Иначе комплект про качество
      # уезжал бы к людям непроверенным — ровно то, против чего он написан.
      - name: все объявленные проверки и порог уровня
        run: node tool/program.mjs doctor --run --min 1

      # --provenance прикладывает удостоверение происхождения: на странице npm видно, из какого
      # коммита и какого прогона собран пакет. Проверить сборку можно не веря на слово.
      - name: публикация
        run: npm publish --provenance --access public

  # Отдельным заданием, а не шагом выше, ради прав: создать релиз нельзя без contents: write,
  # а давать право записи тому же заданию, которое публикует пакет, незачем. Здесь право есть,
  # но нет ни OIDC, ни доступа к реестру.
  #
  # ЗАЧЕМ ВООБЩЕ. Метка v0.2.3 однажды осталась без релиза и без выпуска: снаружи версия
  # выглядела существующей, а её не было. Пока релиз делают руками, такое повторится.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Раздел этой версии из журнала изменений — он и есть заметки к релизу. Держать второй
      # текст «что нового» отдельно от первого значит однажды их рассинхронизировать.
      - name: заметки из журнала изменений
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="$V" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/         { exit }
            on                     { print }
          ' CHANGELOG.md > NOTES.md
          if [ ! -s NOTES.md ]; then
            echo "в CHANGELOG.md нет раздела для версии $V — релиз без заметок не создаём"
            exit 1
          fi
          printf '\n```bash\nnpx agent-quality-kit doctor\n```\n' >> NOTES.md

      - name: релиз на GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file NOTES.md
