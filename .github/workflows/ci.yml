# Конвейер AQK. Прогоняет ровно то же, что человек прогоняет руками, — но на чужой машине
# и без права забыть.
#
# ЗАЧЕМ ИМЕННО ТАК. Проверки жили только локально, и «прогнать всё как надо» означало помнить
# три команды. Забыл — в репозиторий уезжает сломанная программа, и никто не узнает. Отсутствие
# сигнала неотличимо от успеха: журнал шишек, 2026-08-25.
#
# Зависимостей нет: голый Node. Если однажды тут понадобится `npm install`, значит правило
# «зависимостей у программы нет» уже нарушено, и чинить надо не конвейер.

name: проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Два коммита, а не один: по умолчанию checkout берёт мелкий клон, в котором у коммита
      # не видно родителя и состав изменений не определить. Гейт commit-explains-itself в таком
      # клоне честно пропускает себя — то есть здесь бы не проверял ничего.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Дешёвое первым: синтаксис ловится за миллисекунды, и незачем гонять остальное,
      # если исходники не разбираются. Тот же арбитр, что объявлен в манифесте, — второй
      # список команд здесь однажды разошёлся бы с первым.
      - name: исходники разбираются
        run: bash tool/selfcheck/syntax.sh

      # Инструменты, которых требуют записи каталога без переносимого рецепта. Без них такие
      # записи остаются непроверенными — а «не проверено» не должно становиться нормой именно
      # на той машине, где проверка и должна быть строгой.
      - name: инструменты для записей каталога
        run: pipx install vulture==2.16

      # Запись dead-code объявлена как `npx --yes knip@6` — она скачивает инструмент в момент
      # прогона. Скачивание попадало в пятиминутный предел на один гейт, и конвейер краснел от
      # медленного реестра, а не от кода: два падения из четырёх. Красный без изменений в коде —
      # худший сигнал, он учит перезапускать не читая. Тянем заранее, отдельным шагом: здесь у
      # скачивания весь бюджет задания, а к прогону пакет уже лежит в кеше npx.
      - name: заранее скачать инструменты записей
        run: npx --yes knip@6 --version

      # Один шаг вместо списка команд: doctor запускает ровно то, что объявлено в манифесте.
      # Добавили гейт в .aqk.yml — он сам поехал в конвейер, и они не расходятся. Раньше
      # список шагов приходилось держать в голове синхронно с манифестом.
      - name: все объявленные проверки и порог уровня
        run: node tool/program.mjs doctor --run --min 1

      # Значок AQK-3 в README — такое же утверждение, как любое другое, и стареет так же тихо.
      # Здесь он пересчитывается прогоном: разошёлся с фактом — конвейер красный. Мы раздаём
      # этот значок другим проектам, и первое, чем он обязан быть подтверждён, — наш собственный.
      - name: значок в README не врёт
        run: node tool/program.mjs badge --check

  # Действие для чужого конвейера (`uses: arsen-ask-lx/Agent_Quality_Kit@v…`) — файл action.yml
  # в корне. Проверять его тем же прогоном, что и всё остальное, нельзя: он запускает не наш
  # код, а выпущенный в реестр пакет, и ломается ровно там, где мы бы этого не увидели.
  # Поэтому отдельное задание, и подопытный — не мы: репозиторий кладётся в kit/, а в корне
  # собирается чистый проект, каким его увидит посторонний.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: подопытный проект в корне рабочей папки
        run: |
          git init -q .
          mkdir -p src
          printf 'def f():\n    return 1\n' > src/a.py
          printf 'kit/\n' > .aqkignore
          node kit/tool/program.mjs init
          node kit/tool/program.mjs add file-size-limit

      - name: действие ставит проверки в чужой конвейер
        uses: ./kit
        with:
          min: 1
