# Конвейер AQK. Прогоняет ровно то же, что человек прогоняет руками, — но на чужой машине
# и без права забыть.
#
# ЗАЧЕМ ИМЕННО ТАК. Проверки жили только локально, и «прогнать всё как надо» означало помнить
# три команды. Забыл — в репозиторий уезжает сломанная программа, и никто не узнает. Отсутствие
# сигнала неотличимо от успеха: журнал шишек, 2026-08-25.
#
# Зависимостей нет: голый Node. Если однажды тут понадобится `npm install`, значит правило
# «зависимостей у программы нет» уже нарушено, и чинить надо не конвейер.

name: проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Два коммита, а не один: по умолчанию checkout берёт мелкий клон, в котором у коммита
      # не видно родителя и состав изменений не определить. Гейт commit-explains-itself в таком
      # клоне честно пропускает себя — то есть здесь бы не проверял ничего.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Дешёвое первым: синтаксис ловится за миллисекунды, и незачем гонять остальное,
      # если исходники не разбираются. Тот же арбитр, что объявлен в манифесте, — второй
      # список команд здесь однажды разошёлся бы с первым.
      - name: исходники разбираются
        run: bash tool/selfcheck/syntax.sh

      # Инструменты, которых требуют записи каталога без переносимого рецепта. Без них такие
      # записи остаются непроверенными — а «не проверено» не должно становиться нормой именно
      # на той машине, где проверка и должна быть строгой.
      - name: инструменты для записей каталога
        run: |
          pipx install vulture==2.16
          # ruff — арбитр образцов записей no-print-in-prod и swallowed-error. Свои
          # переносимые проверки у них убраны 2026-09-07 по итогам замера, и без ruff
          # обе записи не проверяются НИГДЕ: локально его тоже может не быть.
          pipx install ruff==0.16.6
          # checkwash — арбитр образцов записи test-not-adjusted. Запись объявляет его полем
          # `requires`; без него приёмка пишет «НЕ ПРОВЕРЕНА здесь», а строгий режим ниже
          # превращает это в ошибку — то есть на этой машине запись обязана быть проверена.
          pipx install checkwash==0.2.13
          # pipx кладёт исполняемые файлы в ~/.local/bin, которого нет в PATH этого задания.
          # Без этой строки шаг «установить инструменты» проходит зелёным, инструменты
          # действительно ставятся — и остаются невидимыми: приёмка записей пишет «НЕ
          # ПРОВЕРЕНА здесь, нужен vulture» жёлтой тильдой, а не красным. Так было с самого
          # появления шага: запись dead-code не проверялась в конвейере НИ РАЗУ.
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # slopcheck — арбитр образцов записи no-phantom-package. Ставится глобально, а не
          # через npx: обёртка зовёт его один раз за прогон, и версия обязана быть той, чей
          # формат JSON она разбирает.
          npm i -g slopcheck@0.2.0

      # Запись dead-code объявлена как `npx --yes knip@6` — она скачивает инструмент в момент
      # прогона. Скачивание попадало в пятиминутный предел на один гейт, и конвейер краснел от
      # медленного реестра, а не от кода: два падения из четырёх. Красный без изменений в коде —
      # худший сигнал, он учит перезапускать не читая. Тянем заранее, отдельным шагом: здесь у
      # скачивания весь бюджет задания, а к прогону пакет уже лежит в кеше npx.
      - name: заранее скачать инструменты записей
        run: npx --yes knip@6 --version

      # Один шаг вместо списка команд: doctor запускает ровно то, что объявлено в манифесте.
      # Добавили гейт в .aqk.yml — он сам поехал в конвейер, и они не расходятся. Раньше
      # список шагов приходилось держать в голове синхронно с манифестом.
      - name: все объявленные проверки и порог уровня
        # AQK_GATES_STRICT=1 — здесь «запись не проверена, нет инструмента» обязано быть
        # ошибкой, а не жёлтой тильдой. На чужой машине это законное состояние, на нашей оно
        # означает, что шаг установки инструментов не сработал. Ровно так и было: vulture
        # ставился и оставался вне PATH, а конвейер зеленел.
        env:
          AQK_GATES_STRICT: "1"
        run: node tool/program.mjs doctor --run --min 1

      # Значок AQK-3 в README — такое же утверждение, как любое другое, и стареет так же тихо.
      # Здесь он пересчитывается прогоном: разошёлся с фактом — конвейер красный. Мы раздаём
      # этот значок другим проектам, и первое, чем он обязан быть подтверждён, — наш собственный.
      - name: значок в README не врёт
        run: node tool/program.mjs badge --check

  # Windows. PROJECT.md §9 п.2: «самый тяжёлый дефект был именно там и жил, пока его не нашли
  # чужие руки. Пока прогона на Windows нет, „работает на Windows“ — рассуждение, а не факт».
  # Это задание превращает рассуждение в факт.
  #
  # ЧТО ИМЕННО ПРОВЕРЯЕТСЯ. Переносимость: разбирается ли программа, работают ли переносимые
  # рецепты гейтов на их собственных образцах, переживает ли вердикт мутации, поднимается ли
  # комплект на чистой папке. Оболочка — Git Bash, он есть на раннере штатно; ровно его же
  # README называет способом работать на Windows.
  #
  # ЧЕГО ЗДЕСЬ НЕТ НАМЕРЕННО. Полного `doctor --run`: он тянет knip и vulture, и красный от
  # недоступного инструмента читался бы как красный от непереносимости. Смешивать два разных
  # утверждения в одном сигнале — тот самый дефект, против которого весь проект.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: исходники разбираются
        run: bash tool/selfcheck/syntax.sh

      - name: функции программы
        # Оба файла: проверки уровня и доказательства живут отдельно, и на Windows они не
        # гонялись вовсе — а именно эта платформа спрятала у нас самый тяжёлый дефект.
        run: node --test tool/selfcheck/units.mjs tool/selfcheck/units-level.mjs

      - name: записи каталога краснеют на красном и молчат на зелёном
        run: bash tool/selfcheck/gates.sh

      - name: вердикт переживает мутации образца
        run: bash tool/selfcheck/mutation.sh

      - name: комплект поднимается на чистой папке
        run: bash tool/selfcheck/smoke.sh

      - name: программа запускается и считает уровень
        run: node tool/program.mjs doctor

  # Действие для чужого конвейера (`uses: arsen-ask-lx/Agent_Quality_Kit@v…`) — файл action.yml
  # в корне. Проверять его тем же прогоном, что и всё остальное, нельзя: он запускает не наш
  # код, а выпущенный в реестр пакет, и ломается ровно там, где мы бы этого не увидели.
  # Поэтому отдельное задание, и подопытный — не мы: репозиторий кладётся в kit/, а в корне
  # собирается чистый проект, каким его увидит посторонний.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: подопытный проект в корне рабочей папки
        run: |
          git init -q .
          mkdir -p src
          printf 'def f():\n    return 1\n' > src/a.py
          printf 'kit/\n' > .aqkignore
          node kit/tool/program.mjs init
          node kit/tool/program.mjs add file-size-limit

      - name: действие ставит проверки в чужой конвейер
        uses: ./kit
        with:
          min: 1
