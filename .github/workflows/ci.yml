# Конвейер AQK. Прогоняет ровно то же, что человек прогоняет руками, — но на чужой машине
# и без права забыть.
#
# ЗАЧЕМ ИМЕННО ТАК. Проверки жили только локально, и «прогнать всё как надо» означало помнить
# три команды. Забыл — в репозиторий уезжает сломанная программа, и никто не узнает. Отсутствие
# сигнала неотличимо от успеха: журнал шишек, 2026-08-25.
#
# Зависимостей нет: голый Node. Если однажды тут понадобится `npm install`, значит правило
# «зависимостей у программы нет» уже нарушено, и чинить надо не конвейер.

name: проверки

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Дешёвое первым: синтаксис ловится за миллисекунды, и незачем гонять остальное,
      # если программа не разбирается.
      - name: программа разбирается
        run: node --check tool/program.mjs

      - name: скрипты разбираются
        run: |
          for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done

      # Прогон на чистой папке: так же, как у постороннего человека.
      - name: комплект работает
        run: bash tool/selfcheck/smoke.sh

      # Каждая запись каталога краснеет на красном образце и молчит на зелёном.
      - name: записи каталога годны
        run: bash tool/selfcheck/gates.sh

      # Порог: репозиторий обязан держать собственный стандарт, а не только требовать его.
      - name: уровень не ниже AQK-1
        run: node tool/program.mjs doctor --min 1
