# .aqk.yml — манифест Agent Quality Kit
# Что это: машиночитаемое описание того, как в этом репозитории живут агенты.
# Уровень соответствия считает `aqk doctor`. Пустое поле = ступень не пройдена,
# и это честно: заполнять заглушками бессмысленно, проверяются файлы, а не слова.

aqk: 1

# AQK-0 — что агент читает первым.
entry:
  - AGENTS.md

# AQK-1 — где стандарты и какие проверки обязательны.
rules: kit/rules
gates:
  syntax: "node --check tool/program.mjs"
  smoke: "bash tool/selfcheck/smoke.sh"
  gates: "bash tool/selfcheck/gates.sh"
  # Комплект сторожит сам себя собственными записями. Копий не делаем: здесь каталог и есть
  # репозиторий, а копия завтра разойдётся с оригиналом.
  entry-links-exist: "bash kit/gates/entry-links-exist/check.sh ."
  secrets-not-in-code: "bash kit/gates/secrets-not-in-code/check.sh ."
  gates-are-runnable: "bash kit/gates/gates-are-runnable/check.sh ."
  gates-run-in-ci: "bash kit/gates/gates-run-in-ci/check.sh ."
  file-size-limit: "bash kit/gates/file-size-limit/check.sh ."
  swallowed-error: "bash kit/gates/swallowed-error/check.sh ."
  todo-without-task: "bash kit/gates/todo-without-task/check.sh ."
  deps-are-pinned: "bash kit/gates/deps-are-pinned/check.sh ."
  complexity-limit: "bash kit/gates/complexity-limit/check.sh ."
  duplicate-code: "bash kit/gates/duplicate-code/check.sh ."
  units: "node --test tool/selfcheck/units.mjs"
  # Настройка в knip.json: точкой входа объявлены модульные проверки, областью — tool/.
  # Образцы в kit/gates/ намеренно ни на что не ссылаются, это их природа, а не мёртвый код.
  dead-code: "npx --yes knip --directory ."
  # Печать в program.mjs — интерфейс программы командной строки, а не забытая отладка. По
  # правилу самой записи такие места закрываются храповиком, а не исключением каталога:
  # исключение спрячет и настоящую отладку, реестр — только те строки, что уже есть.
  no-print-in-prod: "bash gates/_ratchet.sh ratchets/no-print-in-prod.txt bash kit/gates/no-print-in-prod/check.sh ."
  proof-from-journal: "bash gates/_ratchet.sh ratchets/proof-from-journal.txt bash tool/selfcheck/conditional.sh"
  gate-has-samples: "bash kit/gates/gate-has-samples/check.sh ."
  lesson-has-outcome: "bash kit/gates/lesson-has-outcome/check.sh ."


# AQK-2 — чем доказано, что гейты работают, и где реестры долга.
# samples: каталог с красными и зелёными образцами (гейт обязан краснеть на первом
# и молчать на втором). ratchets: списки известных нарушений, которые могут только
# укорачиваться.
samples: kit/gates
ratchets: ratchets
# AQK-3 — где копятся уроки. Путь или адрес.
lessons: incidents
