# .aqk.yml — манифест Agent Quality Kit
# Что это: машиночитаемое описание того, как в этом репозитории живут агенты.
# Уровень соответствия считает `aqk doctor`. Пустое поле = ступень не пройдена,
# и это честно: заполнять заглушками бессмысленно, проверяются файлы, а не слова.

aqk: 1

# AQK-0 — что агент читает первым.
entry:
  - AGENTS.md

# AQK-1 — где стандарты и какие проверки обязательны.
rules: kit/rules
gates:
  syntax: "bash tool/selfcheck/syntax.sh"
  smoke: "bash tool/selfcheck/smoke.sh"
  gates: "bash tool/selfcheck/gates.sh"
  # Пара образцов доказывает одно срабатывание. Эта проверка меняет образец так, что вердикт
  # меняться не обязан, и требует, чтобы он не изменился, — PROJECT.md §9 п.4. Первый прогон
  # нашёл четыре гейта, врущих на windows-переносах.
  mutation: "bash tool/selfcheck/mutation.sh"
  # Комплект сторожит сам себя собственными записями. Копий не делаем: здесь каталог и есть
  # репозиторий, а копия завтра разойдётся с оригиналом.
  entry-links-exist: "bash kit/gates/entry-links-exist/check.sh ."
  secrets-not-in-code: "bash kit/gates/secrets-not-in-code/check.sh ."
  gates-are-runnable: "bash kit/gates/gates-are-runnable/check.sh ."
  gates-run-in-ci: "bash kit/gates/gates-run-in-ci/check.sh ."
  # Храповик снят: программа разделена по назначению и уложилась в собственный предел.
  file-size-limit: "bash kit/gates/file-size-limit/check.sh ."
  todo-without-task: "bash kit/gates/todo-without-task/check.sh ."
  deps-are-pinned: "bash kit/gates/deps-are-pinned/check.sh ."
  complexity-limit: "bash kit/gates/complexity-limit/check.sh ."
  duplicate-code: "bash kit/gates/duplicate-code/check.sh ."
  units: "node --test tool/selfcheck/units.mjs"
  # Настройка — ключом "knip" в package.json: точка входа модульные проверки, область tool/.
  # Образцы в kit/gates/ намеренно ни на что не ссылаются, это их природа, а не мёртвый код.
  dead-code: "npx --yes knip@6 --directory ."
  # tool/ — исходники программы командной строки: печать там интерфейс, а не забытая отладка.
  # Названо здесь, а не спрятано в проверке: читающий манифест видит, что именно исключено.
  # swallowed-error и no-print-in-prod сняты 2026-09-07: их переносимые проверки убраны
  # по итогам замера, а готовых инструментов (ruff, eslint) в этом репозитории нет и не
  # будет — зависимостей у комплекта нет по железному правилу. Пункт закрыт не проверкой,
  # а признанием: у нас на JavaScript печать в терминал и есть интерфейс программы.
  proof-from-journal: "bash kit/ratchet/ratchet.sh ratchets/proof-from-journal.txt bash tool/selfcheck/conditional.sh"
  gate-has-samples: "bash kit/gates/gate-has-samples/check.sh ."
  lesson-has-outcome: "bash kit/gates/lesson-has-outcome/check.sh ."
  commit-explains-itself: "bash kit/gates/commit-explains-itself/check.sh ."
  # Первая запись, ловящая приём, а не стиль: не «код плохой», а «сигнал о плохом коде выключен».
  gate-not-weakened: "bash kit/gates/gate-not-weakened/check.sh ."
  # Дыра, найденная у себя: gates-run-in-ci проверял «упомянут», а не «может провалиться».
  ci-actually-fails: "bash kit/gates/ci-actually-fails/check.sh ."
  # Три случая, в которых тест зелёный при любых данных: пустое тело, тавтология, пропуск
  # без причины. Граница найдена замером — «тест без утверждения» оказалось спором о стиле.
  test-has-assertion: "bash kit/gates/test-has-assertion/check.sh ."
  # Центральный вопрос комплекта: у каждого правила в AGENTS.md виден сторож — команда или
  # честно названный человек. На нас самих первый прогон дал 13 правил без сторожа из 13.
  promise-has-gate: "bash kit/gates/promise-has-gate/check.sh ."
  hook-actually-fires: "bash kit/gates/hook-actually-fires/check.sh ."


# AQK-2 — чем доказано, что гейты работают, и где реестры долга.
# samples: каталог с красными и зелёными образцами (гейт обязан краснеть на первом
# и молчать на втором). ratchets: списки известных нарушений, которые могут только
# укорачиваться.
samples: kit/gates
ratchets: ratchets
# AQK-3 — где копятся уроки. Путь или адрес.
lessons: incidents
