# Запись каталога AQK. Норма и все поля — kit/gates/README.md.
# Читается программой; всё, что нельзя выполнить, живёт в README.md рядом.

intent: два свода агента в одном репозитории не расходятся — либо один включает другой, либо они согласны
intent_en: two agent rulebooks in one repository do not drift apart — one includes the other, or they agree

# Только там, где агенту вообще пишут свод. Пара сводов бывает у 85 репозиториев из 300 (замер
# 2026-09-23); проверка сама молча выходит нулём, когда свод в корне один.
trigger:
  has_agent_entry: true

# Готовое есть и оно зеркально неверное: `duke5am/agents-md-check` правилом AGL019 краснеет,
# когда своды НЕ похожи, и молчит, когда похожи. Разбор и прогон — README.md рядом.
recipes:
  any: bash {gate}/check.sh {dir}

proof: incidents/README.md, 2026-09-23 «два свода, две разные версии Go» — замер по 300 чужим
  репозиториям со сводом агента: 85 держат оба файла, 58 уже связывают один с другим, и на
  оставшихся проверка краснеет четырежды. Все четыре разобраны руками: `0x3639/go-syrius`
  обещает Go 1.25.13 в одном своде и Go 1.26 в другом при одном `go.mod`;
  `andrewck24/volleybro` вызывает навыки `$spectra-*` в одном и `/spectra-*` в другом;
  `bwz96sco/or_llm_agent` держит блок команд Trellis только в AGENTS.md;
  `amikos-tech/ami-gin` дописал в CLAUDE.md разделы про CI и стиль кода, в AGENTS.md — нет
