name: разбор входящих

# pull_request_target выполняется в контексте ОСНОВНОЙ ветки и с доступом к секретам,
# а код берётся из ветки автора PR. Классическая дыра.
on:
  pull_request_target:
    types: [opened]

permissions: write-all

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: npm install && npm run build
