intent: конвейер не отдаёт чужому коду свои права и секреты
intent_en: the pipeline does not hand its permissions and secrets to somebody else's code

# Там, где конвейер есть. Без него отдавать нечего.
trigger:
  has_ci: true

recipes:
  any: bash {gate}/check.sh {dir}

# Программа, без которой запись не работает. По первому слову команды этого не видно: обёртка
# начинается с `bash`. Версия названа: обёртка читает итоговую строку вывода zizmor, и смена
# формата обязана быть видимой, а не тихой.
requires: zizmor

proof: incidents/README.md, 2026-09-08 «конвейер отдавал права по подвижной метке» — замер по
  шести настоящим репозиториям показал, что express, flask и uv держат ноль находок высокой и
  средней строгости, а gin (18), ripgrep (19) и httpx (4) нет; сам комплект на момент заведения
  записи имел 13 высоких и 5 средних, включая десять действий, закреплённых меткой вместо SHA
