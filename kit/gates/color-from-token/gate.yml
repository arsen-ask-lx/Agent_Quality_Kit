intent: цвет приходит из токена темы, а не литералом в компоненте
intent_en: colour comes from a theme token, not a literal in the component

# Не по языку, а по наличию интерфейса. Триггер `langs: javascript, typescript` показывал бы
# запись каждому бэкенду, библиотеке и утилите командной строки на JS — а их большинство, и
# интерфейса там нет. Записи, показанной не тому, не верят, и это стоит доверия всему каталогу.
trigger:
  has_ui: true

recipes:
  any: bash {gate}/check.sh {dir}

proof: incidents/README.md, 2026-09-06 «из тридцати с лишним запретов интерфейса гейт ловил
