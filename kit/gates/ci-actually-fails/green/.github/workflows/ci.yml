name: ci
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: npm ci
      - name: тесты
        run: pytest
      - name: типы
        run: tsc --noEmit
      - name: выгрузить отчёт
        run: bash scripts/upload-report.sh
        continue-on-error: true

      # Законный уклад: шаг помечен continue-on-error не для того, чтобы простить провал, а
      # чтобы дать выполниться шагам после него; вердикт выносится ниже, по его исходу.
      # Найдено замером по fastapi (.github/workflows/pre-commit.yml): проверка прогоняется
      # под continue-on-error, потом чинит файлы и пушит их в ветку, а в конце падает, если
      # проверка была красной. Гейт, красящий такое, требует убрать то, без чего уклад не
      # работает, — и его выключат целиком.
      - name: линтер
        id: lint
        run: ruff check .
        continue-on-error: true
      - name: применить починки и запушить
        run: bash scripts/push-fixes.sh
      - name: провалить сборку, если линтер был красным
        if: steps.lint.outcome == 'failure'
        run: exit 1

      # ЗАКОННОЕ ГАШЕНИЕ: инструмент ОБЯЗАН выйти ненулевым, а вердикт выносит следующая
      # команда того же блока. Найдено замером 2026-09-14 по семидесяти чужим конвейерам:
      # это было ЕДИНСТВЕННОЕ срабатывание гейта на всём замере — и оно оказалось ложным
      # (HorusGoul/eslint-plugin-react-render-types, .github/workflows/ci.yml:51). Снимок
      # вывода линтера сверяется с эталоном, шаг проваливается на `diff`.
      - name: линтер как снимок
        run: |
          pnpm eslint src > /tmp/lint-output.txt || true
          diff lint-snapshot.txt /tmp/lint-output.txt

      # Труба после проверки законна, когда код трубы не теряется: явный `shell: bash` идёт
      # как `bash -eo pipefail`, и упавший pytest роняет шаг, хотя последним стоит `tee`.
      - name: тесты с журналом
        run: pytest | tee test.log
        shell: bash
