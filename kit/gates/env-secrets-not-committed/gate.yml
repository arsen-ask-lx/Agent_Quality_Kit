intent: личные файлы окружения и настоящие пароли из .env не попадают в git
intent_en: personal environment files and real passwords from .env do not end up in git

# Только там, где файлом окружения пользуются: признак считает `.env`, `.env.example`,
# `.env.sample` в корне. Проекту без них запись показывать незачем.
trigger:
  has_env: true

# Переносимая проверка — единственный рецепт, и это решение, а не пробел. Готовый `detect-secrets`
# ловит пароли по имени ключа, но не видит `.env.local` (личный по определению, что бы в нём ни
# лежало) и требует файла-базы для работы в конвейере; `gitleaks` пропускает человеческие пароли.
# Замер и таблица — в README записи.
recipes:
  any: bash {gate}/check.sh {dir}

tool: https://github.com/Yelp/detect-secrets

# Условная: живой находки ещё нет. Три проекта владельца (Amplifie, Newsletter, audit_project)
# держат в git только `.env.example`. Доказательство станет журнальным с первой настоящей.
proof: research/competitors/agentlint.md — замер 2026-09-11: на закоммиченном .env пароли,
  придуманные человеком, не видят ни наш secrets-not-in-code, ни gitleaks 8.30.1; .env.local не
  видит и detect-secrets 1.5.0
