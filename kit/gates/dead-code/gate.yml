intent: код, который никто не вызывает, не остаётся в проекте
intent_en: code nobody calls does not stay in the project

# Только там, где есть готовый инструмент: переносимой проверки здесь быть не может, а
# показывать запись тем, кому её нечем исполнить, — значит показывать работу, которую
# человек сделать не сможет.
trigger:
  langs: python, typescript, javascript, go, rust

# Переносимого рецепта здесь нет намеренно: чтобы понять, вызывают ли функцию, нужен граф
# вызовов, а не поиск по тексту. Это тот случай, когда без готового инструмента не обойтись —
# и он есть под каждый распространённый стек.
recipes:
  python: vulture --min-confidence 60 {dir}
  typescript: npx --yes knip@6 --directory {dir}
  javascript: npx --yes knip@6 --directory {dir}
  go: staticcheck -checks U1000 {dir}/...
  rust: cargo clippy --manifest-path {dir}/Cargo.toml -- -D dead_code

# Каким рецептом написаны образцы: без переносимого рецепта проверка обязана знать это точно,
# иначе питоновские образцы поедут проверяться фронтовым инструментом.
samples_for: python

proof: incidents/README.md — «2026-08-27 ревизия гейтов», п. 5: мёртвые функции бэкенда не искал никто, реестр на 148 записей
