intent: у каждого правила в точке входа виден сторож — команда или названный человек
intent_en: every rule in the entry point names its enforcer — a command or, honestly, a human

# Там, где уже есть манифест и объявленные гейты: без них сопоставлять нечего.
trigger:
  has_gates: true

recipes:
  any: bash {gate}/check.sh {dir}

proof: incidents/README.md, 2026-09-06 «тринадцать собственных правил без сторожа» — прогон по
  своему же AGENTS.md показал, что ни одно из тринадцати железных правил не называет, кто за
  ним следит; после разметки одиннадцать оказались исполняемыми человеком, и это стало видно
  впервые
