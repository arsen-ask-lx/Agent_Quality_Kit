intent: каждая записанная шишка кончается решением, а не рассказом

# Проверять нечего там, где журнала нет: запись сама скажет об этом и промолчит.
trigger:
  always: true

recipes:
  any: bash {gate}/check.sh {dir}

proof: incidents/README.md, 2026-09-03 «журнал рассказывал, но не отчитывался» — из 20 шишек
  отметку о решении носили две, и петля «шишка → сторож» была невидима на своём же журнале
