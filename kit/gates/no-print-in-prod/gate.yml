intent: отладочная печать не доезжает до прод-кода
intent_en: debug printing does not reach production code

# Запись касается только языков, где под неё есть готовый инструмент. В проекте
# на Go или Rust она не показывается вовсе — и переносимого рецепта здесь больше нет.
trigger:
  langs: python, javascript, typescript

# Переносимого рецепта нет намеренно. Он был, и замер по пяти чужим репозиториям
# (httpx, fastapi, zod, cobra, ripgrep) дал 434 находки, из которых настоящих — ноль:
# печать в примерах документации, в тестах, в бенчмарках и в выводе командной строки.
# Отличить их от отладки можно только разбором кода, а не поиском по тексту, — и это
# ровно то, что уже делают ruff и eslint.
recipes:
  python: ruff check --select T20 {dir}
  typescript: eslint --rule '{"no-console":"error"}' {dir}
  javascript: eslint --rule '{"no-console":"error"}' {dir}

# Каким рецептом написаны образцы: без переносимого рецепта проверка обязана знать это точно,
# иначе питоновские образцы поедут проверяться фронтовым инструментом.
samples_for: python

proof: incidents/README.md, 2026-09-07 «замер по пяти стекам вынес приговор пяти записям» —
  434 находки переносимой проверки на пяти чужих репозиториях, настоящих ноль
