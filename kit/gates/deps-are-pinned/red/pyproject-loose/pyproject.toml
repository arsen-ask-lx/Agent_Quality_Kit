# Питоновская библиотека, которая закрепляет версии не файлом блокировки, а точными версиями
# в requirements.txt. Так делает httpx и весь класс проектов, живущих без poetry и uv:
# инструменты закреплены до патча, а границы зависимостей самой библиотеки оставлены широкими
# намеренно — библиотека, закрепившая их у себя, ломает сборку всем, кто её ставит.
[project]
name = "sample-lib"
version = "1.0.0"
dependencies = ["httpx"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
