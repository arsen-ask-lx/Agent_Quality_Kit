intent: тест умеет провалиться — тело не пустое, утверждение не тавтология, пропуск с причиной
intent_en: a test can actually fail — no empty body, no tautology, no skip without a reason

# Там, где есть тесты. Триггер по наличию, а не по языку: разбор покрывает python, javascript
# и typescript, а пропуски и тавтологии ловятся во всех перечисленных расширениях.
trigger:
  has_tests: true

recipes:
  any: bash {gate}/check.sh {dir}

proof: incidents/README.md, 2026-09-06 «граница проверки найдена замером» — прогон по
  девятнадцати чужим репозиториям (около 25 000 файлов) даёт 8 находок: шесть выключенных
  тестов без причины в `swr` (30 000 звёзд) и два в `kodus-ai`. Первая версия давала 1843
  находки, из них 1843 ложных
