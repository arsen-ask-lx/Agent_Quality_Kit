intent: маркеров «доделать потом» нет в готовом коде — вместо них заведённая задача
intent_en: "fix later" markers are absent from finished code — a filed task replaces them

trigger:
  always: true

# Домашние страницы готовых инструментов, которые зовут рецепты ниже. Адреса сверены
# по реестру github 2026-09-10, а не написаны по памяти: три выдуманных адреса чужих
# репозиториев — записанная шишка комплекта.
tool: https://github.com/astral-sh/ruff · https://github.com/eslint/eslint

recipes:
  any: bash {gate}/check.sh {dir}
  # Готовое правило точнее самописного и не требует поддержки.
  python: ruff check -q --output-format=concise --select FIX,TD {dir}
  typescript: eslint --no-config-lookup --ignore-pattern 'gates/*/red/**' --ignore-pattern 'gates/*/green/**' --rule '{"no-warning-comments":["error",{"terms":["todo","fixme","hack","xxx"]}]}' {dir}

proof: incidents/README.md — «2026-08-25 разбор 1069 коммитов»: 416 коммитов из 1069 оказались стабилизацией уже выкаченного

# У Biome правила под TODO нет вовсе — сверено по схеме конфигурации Biome 2.5.12. Заявка
# «lint (biome) держит эту запись» поэтому заведомо неверна, и doctor так и говорит.
biome_rules: none
