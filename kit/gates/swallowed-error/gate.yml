intent: ошибка не глушится молча — она обработана и записана либо проброшена
intent_en: an error is not silently swallowed — it is handled and logged, or re-raised

# Только языки, под которые есть готовый разбор кода. Переносимой проверки здесь больше нет:
# отличить «перехват ради тишины» от законного `except ImportError: pass` можно разбором,
# а не поиском по тексту.
trigger:
  langs: python, javascript, typescript, go

# Домашние страницы готовых инструментов, которые зовут рецепты ниже. Адреса сверены
# по реестру github 2026-09-10, а не написаны по памяти: три выдуманных адреса чужих
# репозиториев — записанная шишка комплекта.
tool: https://github.com/astral-sh/ruff · https://github.com/eslint/eslint · https://github.com/kisielk/errcheck

recipes:
  # BLE — ловля голого исключения, TRY400 — запись без трейса, SIM105 — перехват ради тишины.
  python: ruff check -q --output-format=concise --select BLE,TRY400,SIM105 {dir}
  typescript: eslint --no-config-lookup --ignore-pattern 'gates/*/red/**' --ignore-pattern 'gates/*/green/**' --rule '{"no-empty":["error",{"allowEmptyCatch":false}]}' {dir}
  javascript: eslint --no-config-lookup --ignore-pattern 'gates/*/red/**' --ignore-pattern 'gates/*/green/**' --rule '{"no-empty":["error",{"allowEmptyCatch":false}]}' {dir}
  # errcheck — канонический инструмент Go под этот же предмет: ошибка присвоена и не проверена.
  go: errcheck -blank {dir}/...

samples_for: python

proof: incidents/README.md, 2026-09-07 «замер по пяти стекам вынес приговор пяти записям» —
  переносимая версия дала 46 находок на пяти чужих репозиториях, настоящими оказались только
  пустые `catch {}` в zod; весь питоновский класс `except ImportError: pass` и растовый
  `let _ = write(..)?` были ложными
