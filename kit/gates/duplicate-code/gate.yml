intent: один и тот же код не размножается по проекту копиями
intent_en: the same code does not multiply into copies across the project

trigger:
  files_gt: 20

recipes:
  any: bash {gate}/check.sh {dir}
  # jscpd умеет и Python, и TypeScript одним прогоном и считает похожесть, а не совпадение.
  #
  # --format обязателен: без него jscpd считает клонами разметку, JSON и текст. Замер на живом
  # проекте (Django + React, 2750 файлов кода): 1846 клонов, из них 435 — markdown, json и
  # text, то есть 23.6% находок не про код вовсе. Переносимая проверка смотрит только в
  # расширения кода (CODE_EXT в _skip.sh), и родная обязана мерить то же самое: иначе один
  # гейт означает разное на разных машинах.
  #
  # «c#» в списке нет намеренно: разбор манифеста режет строку по «#», и рецепт обрывался бы
  # на «c». Обёртку _native.sh не пишем — её добавляет сама программа при установке гейта.
  #
  # Рецепт стоял только под javascript и typescript, хотя список --format покрывает и Python,
  # и Go. Питоновский проект получал переносимую самоделку вместо готового инструмента —
  # найдено ревизией каталога 2026-09-07, замером по пяти стекам.
  javascript: npx --yes jscpd@5 --min-lines 8 --threshold 1 --format "javascript,jsx,typescript,tsx,vue,python,go,ruby,java,php,rust,kotlin,swift,scala" {dir}
  typescript: npx --yes jscpd@5 --min-lines 8 --threshold 1 --format "javascript,jsx,typescript,tsx,vue,python,go,ruby,java,php,rust,kotlin,swift,scala" {dir}
  # Родной инструмент стека, а не jscpd: питоновскому проекту незачем ставить Node ради одной
  # проверки. R0801 сравнивает не байты, а разобранный код — переименованная переменная его
  # не обманет, в отличие от переносимого рецепта.
  # `--ignore-paths` — исключение на ВХОДЕ, а не фильтром вывода. `aqk add` кладёт красные
  # образцы в проект, и они по построению дублируют друг друга: без исключения pylint
  # предъявлял пользователю НАШИ ЖЕ файлы как его дубликаты. Найдено 2026-09-10 табличной
  # проверкой own-samples в тот час, когда pylint появился на машине.
  python: pylint --disable=all --enable=R0801 --min-similarity-lines=8 --ignore-paths='.*gates/[^/]+/(red|green)(/|$).*' {dir}

proof: incidents/README.md — «2026-08-25 разбор 1069 коммитов»: число моделей захардкожено в четырёх местах четырьмя разными значениями
