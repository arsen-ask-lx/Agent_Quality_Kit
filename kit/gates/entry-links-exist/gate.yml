# Запись каталога AQK. Формат: намерение · арбитр · триггер · доказательство.
# Читается программой; всё, что нельзя выполнить, живёт в README.md рядом.

intent: файлы, на которые ссылается точка входа, существуют на диске

# Когда запись показывается человеку. Отсутствие триггера сделало бы её шумом
# для тех, кого она не касается.
trigger:
  always: true

# Команда-арбитр под каждый стек. {dir} — каталог, который проверяют.
# `any` — команда без зависимостей, работает везде, где есть sh и grep.
recipes:
  any: bash {gate}/check.sh {dir}

proof: incidents/README.md — «2026-08-24 документ четыре недели утверждал защиту, которой не было»
